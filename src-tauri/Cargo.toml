[package]
name = "stackql-workbench"
version = "0.1.0"
description = "Desktop query IDE and chat interface for StackQL"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/stackql/stackql-workbench"
publish = false

[lib]
# The lib name must differ from the bin name, see rust-lang/cargo#8519.
name = "stackql_workbench_lib"

[[bin]]
name = "stackql-workbench"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "process",
  "io-util",
  "net",
  "time",
  "sync",
  "rt",
  "rt-multi-thread",
  "macros",
] }
tokio-postgres = "0.7"
futures-util = "0.3"
# Text only. The default feature adds image support, which is not used.
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
