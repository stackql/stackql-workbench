name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Puts stackql on PATH so the integration tests run instead of being
      # skipped. They use metadata statements and the built-in provider only:
      # no credentials and no provider downloads.
      - uses: stackql/setup-stackql@v2

      - name: Tool versions
        shell: bash
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          stackql --version

      - name: Install webview dependencies
        run: npm ci

      - name: Lint and format check (webview)
        run: npm run lint

      - name: Typecheck (webview)
        run: npm run typecheck

      - name: Test (webview)
        run: npm test

      - name: Format check (host)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint (host)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (host)
        working-directory: src-tauri
        run: cargo test

      # Builds the webview bundle and the host together, without installers.
      - name: Debug build
        run: npm run tauri build -- --debug --no-bundle

  # A test build for a Mac, kept as a workflow artifact. It is not a release:
  # the signature is ad hoc, with no Developer ID, and nothing is notarised.
  # It does not wait for the checks, so a failing test still leaves a build.
  bundle-macos:
    name: Bundle (macOS, universal)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # A universal build needs the standard library for both architectures.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install webview dependencies
        run: npm ci

      # An Apple Silicon Mac runs no code without a signature. "-" asks for an
      # ad hoc one, which needs no certificate.
      - name: Build the app and the disk image
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: Check the bundle
        shell: bash
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          app=$(ls -d "$bundle"/macos/*.app)
          archs=$(lipo -archs "$app/Contents/MacOS/stackql-workbench")
          echo "Architectures: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app"
          ls -l "$bundle"/dmg

      - uses: actions/upload-artifact@v7
        with:
          name: stackql-workbench-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
